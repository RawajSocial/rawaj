name: CI/CD - Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: server/Rawaj
        run: dotnet restore

      - name: Build
        working-directory: server/Rawaj
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: server/Rawaj
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        working-directory: server/Rawaj
        run: >
          dotnet publish Rawaj/Rawaj.csproj
          --configuration Release
          --no-restore
          --output ${{ github.workspace }}/publish/backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-backend
          path: publish/backend
          retention-days: 7

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Build Angular
        working-directory: front
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rawaj-frontend
          path: front/dist/rawaj-front/browser
          retention-days: 7

  deploy:
    name: Deploy to Dev VM
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    concurrency:
      group: rawaj-dev-deploy
      cancel-in-progress: false

    env:
      STAGE_DIR: /tmp/rawaj-deploy-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: rawaj-backend
          path: artifacts/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: rawaj-frontend
          path: artifacts/frontend

      - name: Sanity check downloaded artifacts
        run: |
          echo "Backend artifact contents:"
          find artifacts/backend -maxdepth 2 -printf '%y %p\n' | sort

          echo "Frontend artifact contents:"
          find artifacts/frontend -maxdepth 2 -printf '%y %p\n' | sort

          test -f artifacts/backend/Rawaj.dll
          test -f artifacts/frontend/index.html

      - name: Prepare staging directory on VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: STAGE_DIR
          script: |
            set -euo pipefail
            mkdir -p "${STAGE_DIR}/backend" "${STAGE_DIR}/frontend"

      - name: Copy backend artifact to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "artifacts/backend/*"
          target: "${{ env.STAGE_DIR }}/backend"
          strip_components: 2
          overwrite: true

      - name: Copy frontend artifact to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          source: "artifacts/frontend/*"
          target: "${{ env.STAGE_DIR }}/frontend"
          strip_components: 2
          overwrite: true

      - name: Verify staged artifacts on VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: STAGE_DIR
          script: |
            set -euo pipefail

            test -d "${STAGE_DIR}/backend"
            test -d "${STAGE_DIR}/frontend"

            echo "Backend staging:"
            find "${STAGE_DIR}/backend" -maxdepth 1 -type f -printf '%f\n' | sort

            echo "Frontend staging:"
            find "${STAGE_DIR}/frontend" -maxdepth 1 -type f -printf '%f\n' | sort

            test -f "${STAGE_DIR}/backend/Rawaj.dll"
            test -f "${STAGE_DIR}/frontend/index.html"

      - name: Deploy on VM and verify
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          envs: STAGE_DIR
          request_pty: true
          script: |
            set -euo pipefail

            log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] [DEPLOY] $*"
            }

            fail() {
              echo "ERROR: $1" >&2
              exit 1
            }

            # All privileged commands go through sudo -n: if passwordless sudo
            # isn't available for this session, fail immediately with a clear
            # message instead of hanging on an unanswerable password prompt.
            run_sudo() {
              if ! sudo -n "$@"; then
                fail "sudo -n failed for: sudo $* (passwordless sudo not available for this SSH session)"
              fi
            }

            dump_diagnostics() {
              log "Dumping recent logs for diagnosis..."
              sudo -n journalctl -u rawaj.service -n 100 --no-pager || true
              sudo -n journalctl -u rawaj-front.service -n 100 --no-pager || true
            }

            rollback() {
              log "Verification failed - rolling back to previous release..."
              if [ -d "${BACKUP_DIR}/rawaj-${TS}" ]; then
                sudo -n rm -rf /opt/rawaj
                sudo -n cp -a "${BACKUP_DIR}/rawaj-${TS}" /opt/rawaj
              fi
              if [ -d "${BACKUP_DIR}/rawaj-front-${TS}" ]; then
                sudo -n rm -rf /opt/rawaj-front
                sudo -n cp -a "${BACKUP_DIR}/rawaj-front-${TS}" /opt/rawaj-front
              fi
              sudo -n systemctl restart rawaj.service || true
              sudo -n systemctl restart rawaj-front.service || true
              sudo -n rm -rf "${STAGE_DIR}" || true
              fail "Deployment rolled back; see log above for the failing check."
            }

            TS="$(date +%Y%m%d%H%M%S)"
            BACKUP_DIR="/opt/backups"

            log "Creating backup directory..."
            run_sudo mkdir -p "${BACKUP_DIR}"
            log "Backup directory ready."

            [ -d "${STAGE_DIR}/backend" ] || fail "Backend staging directory missing: ${STAGE_DIR}/backend"
            [ -d "${STAGE_DIR}/frontend" ] || fail "Frontend staging directory missing: ${STAGE_DIR}/frontend"
            [ -f "${STAGE_DIR}/backend/Rawaj.dll" ] || fail "Rawaj.dll not found in staged backend artifact"

            log "Preserving ASP.NET Core Data Protection keys..."
            if [ -d /opt/rawaj/.aspnet ]; then
              run_sudo cp -a /opt/rawaj/.aspnet "${STAGE_DIR}/backend/.aspnet"
            fi
            log "Data Protection keys preserved."

            log "Chowning staged files to rawaj:rawaj..."
            run_sudo chown -R rawaj:rawaj "${STAGE_DIR}/backend" "${STAGE_DIR}/frontend"
            log "Staged files chowned."

            log "Checking current deployment size (informational only)..."
            sudo -n du -sh /opt/rawaj 2>/dev/null || true
            sudo -n du -sh /opt/rawaj-front 2>/dev/null || true

            log "Starting backend backup..."
            run_sudo rm -rf "${BACKUP_DIR}/rawaj-${TS}"
            run_sudo cp -a /opt/rawaj "${BACKUP_DIR}/rawaj-${TS}"
            log "Backend backup complete."

            log "Starting frontend backup..."
            run_sudo rm -rf "${BACKUP_DIR}/rawaj-front-${TS}"
            run_sudo cp -a /opt/rawaj-front "${BACKUP_DIR}/rawaj-front-${TS}"
            log "Frontend backup complete."

            swap_backend() {
              sudo -n rm -rf /opt/rawaj.new &&
              sudo -n mv "${STAGE_DIR}/backend" /opt/rawaj.new &&
              sudo -n rm -rf /opt/rawaj &&
              sudo -n mv /opt/rawaj.new /opt/rawaj &&
              sudo -n chown -R rawaj:rawaj /opt/rawaj
            }

            swap_frontend() {
              sudo -n rm -rf /opt/rawaj-front.new &&
              sudo -n mv "${STAGE_DIR}/frontend" /opt/rawaj-front.new &&
              sudo -n rm -rf /opt/rawaj-front &&
              sudo -n mv /opt/rawaj-front.new /opt/rawaj-front &&
              sudo -n chown -R rawaj:rawaj /opt/rawaj-front
            }

            log "Starting backend swap..."
            if ! swap_backend; then
              rollback
            fi
            log "Backend swap complete."

            log "Starting frontend swap..."
            if ! swap_frontend; then
              rollback
            fi
            log "Frontend swap complete."

            log "Current service status before restart (informational only)..."
            sudo -n systemctl status rawaj.service --no-pager || true
            sudo -n systemctl status rawaj-front.service --no-pager || true

            log "Starting backend restart..."
            if ! sudo -n systemctl restart rawaj.service; then
              dump_diagnostics
              rollback
            fi
            log "Backend restart complete."

            log "Starting frontend restart..."
            if ! sudo -n systemctl restart rawaj-front.service; then
              dump_diagnostics
              rollback
            fi
            log "Frontend restart complete."

            log "Waiting for services to settle..."
            sleep 5

            log "Starting service verification..."
            BACKEND_ACTIVE="$(systemctl is-active rawaj.service || true)"
            FRONTEND_ACTIVE="$(systemctl is-active rawaj-front.service || true)"
            log "rawaj.service is-active: ${BACKEND_ACTIVE}"
            log "rawaj-front.service is-active: ${FRONTEND_ACTIVE}"

            if [ "${BACKEND_ACTIVE}" != "active" ] || [ "${FRONTEND_ACTIVE}" != "active" ]; then
              dump_diagnostics
              rollback
            fi
            log "Service verification complete."

            log "Starting port verification..."
            BACKEND_PORT_COUNT="$(sudo -n ss -lntp | grep -c ':5000 ' || true)"
            FRONTEND_PORT_COUNT="$(sudo -n ss -lntp | grep -c ':4200 ' || true)"
            log "Listeners on :5000 -> ${BACKEND_PORT_COUNT}"
            log "Listeners on :4200 -> ${FRONTEND_PORT_COUNT}"

            if [ "${BACKEND_PORT_COUNT}" -eq 0 ] || [ "${FRONTEND_PORT_COUNT}" -eq 0 ]; then
              dump_diagnostics
              rollback
            fi
            log "Port verification complete."

            log "Starting staging cleanup..."
            sudo -n rm -rf "${STAGE_DIR}" || true
            log "Staging cleanup complete."

            log "Starting backup trimming (keeping last 3 per app)..."
            for app in rawaj rawaj-front; do
              ls -1dt "${BACKUP_DIR}/${app}-"* 2>/dev/null | tail -n +4 | xargs -r sudo -n rm -rf || true
            done
            log "Backup trimming complete."

            log "Deployment successful."
