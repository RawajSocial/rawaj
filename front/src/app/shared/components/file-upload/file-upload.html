<div
  class="file-upload"
  [class.file-upload--circle]="shape() === 'circle'"
  [class.file-upload--dragging]="dragActive()"
  [class.file-upload--disabled]="disabled()"
>
  @if (resolvedPreview) {
    <div
      class="file-upload-preview"
      role="button"
      tabindex="0"
      [attr.aria-label]="label()"
      [attr.aria-disabled]="disabled()"
      (click)="openFilePicker()"
      (keydown)="onDropzoneKeydown($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <img [src]="resolvedPreview" [alt]="altText()" class="file-upload-preview__img" (error)="onPreviewError()" />

      @if (uploadProgress() !== null) {
        <div class="file-upload-progress">
          <div class="file-upload-progress__bar" [style.width.%]="uploadProgress()"></div>
          <span class="file-upload-progress__label">{{ uploadProgress() }}%</span>
        </div>
      } @else {
        <div class="file-upload-preview__hover">
          <i class="fa-solid fa-camera"></i>
        </div>
      }

      <button
        type="button"
        class="file-upload-preview__remove"
        [disabled]="disabled()"
        (click)="remove($event)"
        title="حذف"
        aria-label="حذف الصورة"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  } @else {
    <div
      class="file-upload-dropzone"
      role="button"
      tabindex="0"
      [attr.aria-label]="label()"
      [attr.aria-disabled]="disabled()"
      (click)="openFilePicker()"
      (keydown)="onDropzoneKeydown($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <i class="{{ icon() }}"></i>
      <span>{{ fileName() ?? label() }}</span>
    </div>
  }

  <input
    #fileInput
    type="file"
    [accept]="accept()"
    [disabled]="disabled()"
    class="file-upload-hidden-input"
    tabindex="-1"
    (change)="onFileChange($event)"
  />
</div>
