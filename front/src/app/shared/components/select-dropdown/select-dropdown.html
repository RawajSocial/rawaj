<button type="button" class="select-dropdown__trigger" (click)="toggleOpen()" [disabled]="disabled()">
  <span>{{ selectedLabel }}</span>
  <i class="fa-solid fa-chevron-down select-dropdown__arrow"></i>
</button>

@if (isOpen()) {
  <ul class="select-dropdown__menu">
    @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          class="select-dropdown__option"
          [class.active]="option.value === value()"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </button>
      </li>
    }
  </ul>
}
