<app-modal-shell [open]="state().open" [maxWidth]="420" (closed)="close()">
  <div class="celebration-modal">
    <div class="celebration-modal__confetti" #confetti></div>

    <svg class="celebration-modal__check" viewBox="0 0 80 80" width="80" height="80">
      <circle #checkCircle cx="40" cy="40" r="36" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
      <path #checkPath d="M24 41 L35 52 L57 28" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>

    <h3 class="celebration-modal__title">{{ state().title }}</h3>
    <p class="celebration-modal__message">{{ state().message }}</p>
  </div>

  <div modal-footer class="celebration-modal__footer">
    <button type="button" class="celebration-modal__btn" (click)="close()">رائع!</button>
  </div>
</app-modal-shell>
