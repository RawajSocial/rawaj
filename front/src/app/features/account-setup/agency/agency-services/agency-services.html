<div class="step-animate">
  <h2 class="step-title">الخدمات الأساسية</h2>
  <p class="step-subtitle">اختر الخدمات التي تقدمها وكالتك. يمكنك التعديل لاحقاً.</p>

  <div class="chip-grid">
    @for (service of services; track service.label) {
      <button
        type="button"
        class="ms-chip"
        [class.selected]="isSelected(service.label)"
        (click)="toggle(service.label)">
        <i class="{{ service.icon }}"></i>
        {{ service.label }}
      </button>
    }
  </div>

  @if (showError()) {
    <p class="field-error" style="margin-top:1rem;">
      <i class="fa-solid fa-circle-exclamation"></i>
      يرجى اختيار خدمة واحدة على الأقل.
    </p>
  }

  <div class="step-actions">
    <div class="start">
      <button type="button" class="btn-back" (click)="back.emit()">
        <i class="fa-solid fa-arrow-right"></i>
        السابق
      </button>
    </div>
    <button type="button" class="btn-next" (click)="onNext()">
      التالي
      <i class="fa-solid fa-arrow-left"></i>
    </button>
  </div>
</div>
