<form class="step-animate" [formGroup]="form" (ngSubmit)="onNext()">
  <h2 class="step-title">أين يقع نشاطك التجاري؟</h2>
  <p class="step-subtitle">سنستخدم هذا لتخصيص المحتوى وفق سوقك.</p>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-flag" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      الدولة
    </label>
    <input
      type="text"
      class="setup-input"
      formControlName="country"
      readonly
      style="background:var(--color-bg-secondary); cursor:default; color:var(--color-text-muted);" />
  </div>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-map-pin" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      المدينة
    </label>
    <div class="setup-dropdown" [class.open]="cityOpen()">
      <button
        type="button"
        class="setup-dropdown-trigger"
        [class.empty]="!cityCtrl.value"
        (click)="cityOpen.update(v => !v)">
        <span class="setup-dropdown-label">{{ cityCtrl.value || 'اختر مدينتك' }}</span>
        <i class="fa-solid fa-chevron-down setup-dropdown-arrow"></i>
      </button>
      <div class="setup-dropdown-menu">
        @for (city of cities; track city) {
          <button
            type="button"
            class="setup-dropdown-option"
            [class.selected]="cityCtrl.value === city"
            (click)="selectCity(city)">
            <i class="fa-solid fa-location-dot"></i>
            {{ city }}
          </button>
        }
      </div>
    </div>
    @if (cityCtrl.invalid && cityCtrl.touched) {
      <span class="field-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        يرجى اختيار مدينتك.
      </span>
    }
  </div>

  <div class="step-actions">
    <div class="start">
      <button type="button" class="btn-back" (click)="back.emit()">
        <i class="fa-solid fa-arrow-right"></i>
        السابق
      </button>
    </div>
    <button type="submit" class="btn-next">
      التالي
      <i class="fa-solid fa-arrow-left"></i>
    </button>
  </div>
</form>
