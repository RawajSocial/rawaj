<div class="step-animate">
  <h2 class="step-title">تفاصيل إضافية</h2>
  <p class="step-subtitle">هذا يساعدنا على فهم سياق نشاطك التجاري.</p>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-chart-simple" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      حجم النشاط التجاري
    </label>
    <div class="radio-group">
      @for (size of sizes; track size.value) {
        <button
          type="button"
          class="radio-chip"
          [class.selected]="selectedSize() === size.value"
          (click)="selectedSize.set(size.value); showError.set(false)">
          <i class="{{ size.icon }}"></i>
          {{ size.label }}
        </button>
      }
    </div>
  </div>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-compass" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      كيف عرفت عنّا؟
    </label>
    <div class="radio-group">
      @for (option of hearAboutList; track option.value) {
        <button
          type="button"
          class="radio-chip"
          [class.selected]="selectedHear() === option.value"
          (click)="selectedHear.set(option.value); showError.set(false)">
          <i class="{{ option.icon }}"></i>
          {{ option.label }}
        </button>
      }
    </div>
  </div>

  @if (showError()) {
    <p class="field-error" style="margin-bottom:1rem;">
      <i class="fa-solid fa-circle-exclamation"></i>
      يرجى اختيار الخيارَين للمتابعة.
    </p>
  }

  <div class="step-actions">
    <div class="start">
      <button type="button" class="btn-back" (click)="back.emit()">
        <i class="fa-solid fa-arrow-right"></i>
        السابق
      </button>
    </div>
    <button type="button" class="btn-next" (click)="onNext()">
      التالي
      <i class="fa-solid fa-arrow-left"></i>
    </button>
  </div>
</div>
