<div class="type-selector">
  <div class="type-header">
    <div class="type-badge">
      <img src="assets/icons/logo.png" width="50" alt="">
    </div>
    <h1 class="type-title">مرحباً بك في رواج</h1>
    <p class="type-subtitle">أخبرنا عن نفسك لنوفر لك تجربة مخصصة</p>
  </div>

  <div class="type-cards">
    <button class="type-card agency-card" (click)="select('agency')">
      <div class="type-card-icon agency-icon">
       <img src="assets/icons/agency.png" width="70" alt="">
      </div>
      <h2 class="type-card-title">وكالة تسويق</h2>
      <p class="type-card-desc">أدير حملات تسويقية لعدة عملاء وأحتاج لأدوات احترافية</p>
      <div class="type-card-footer">
        <span class="type-card-cta">ابدأ الآن <i class="fa-solid fa-arrow-left"></i></span>
      </div>
    </button>

    <button class="type-card business-card" (click)="select('business')">
      <div class="type-card-glow business-glow"></div>
      <div class="type-card-icon business-icon">
        <img src="assets/icons/business.png" width="70" alt="">
      </div>
      <h2 class="type-card-title">صاحب نشاط تجاري</h2>
      <p class="type-card-desc">لديّ نشاط تجاري وأريد الترويج لمنتجاتي وخدماتي</p>
      <div class="type-card-footer">
        <span class="type-card-cta">ابدأ الآن <i class="fa-solid fa-arrow-left"></i></span>
      </div>
    </button>
  </div>
</div>
