<div class="media-toolbar">

  <div class="filter-tabs">
    <button type="button" class="filter-tab" [class.active]="filterType() === 'all'" (click)="filterTypeChange.emit('all')">
      الكل <span class="filter-count">{{ counts().all }}</span>
    </button>
    <button type="button" class="filter-tab" [class.active]="filterType() === 'static-ad'" (click)="filterTypeChange.emit('static-ad')">
      <i class="{{ typeCfg['static-ad'].icon }}" [style.color]="filterType() === 'static-ad' ? typeCfg['static-ad'].color : ''"></i>
      إعلانات ثابتة <span class="filter-count">{{ counts()['static-ad'] }}</span>
    </button>
    <button type="button" class="filter-tab" [class.active]="filterType() === 'video'" (click)="filterTypeChange.emit('video')">
      <i class="{{ typeCfg['video'].icon }}" [style.color]="filterType() === 'video' ? typeCfg['video'].color : ''"></i>
      فيديوهات <span class="filter-count">{{ counts().video }}</span>
    </button>
    <button type="button" class="filter-tab" [class.active]="filterType() === 'text'" (click)="filterTypeChange.emit('text')">
      <i class="{{ typeCfg['text'].icon }}" [style.color]="filterType() === 'text' ? typeCfg['text'].color : ''"></i>
      نصوص <span class="filter-count">{{ counts().text }}</span>
    </button>
  </div>

  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text"
           class="search-input"
           placeholder="ابحث في إعلاناتك..."
           [value]="searchQuery()"
           (input)="searchQueryChange.emit($any($event.target).value)">
  </div>

</div>
