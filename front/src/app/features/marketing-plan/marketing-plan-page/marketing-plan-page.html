<div class="mp-shell" dir="rtl">
  @switch (phase()) {
    @case ('empty') {
      <app-mp-empty-state (startPlan)="goToOnboarding()"></app-mp-empty-state>
    }
    @case ('generating') {
      <app-mp-generating
        [stages]="stages"
        [completedCount]="completedCount()"
        [progressPct]="progressPct()"
        [streamedItems]="streamedItems()">
      </app-mp-generating>
    }
    @case ('plans') {
      <app-mp-plans-list
        [plans]="savedPlans()"
        (planSelected)="openPlan($event)"
        (newPlan)="goToOnboarding()">
      </app-mp-plans-list>
    }
    @case ('detail') {
      <app-mp-plan-detail
        [plan]="plan()"
        [initialPosts]="calPosts()"
        [savedPlansCount]="savedPlans().length"
        (remakeClicked)="remake()"
        (approveClicked)="approve()"
        (backClicked)="backToPlans()"
        (editSaved)="handleEditSave($event)">
      </app-mp-plan-detail>
    }
  }
</div>
