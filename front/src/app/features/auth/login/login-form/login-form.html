<div class="login-card">

  <div class="text-center">
      <h2>تسجيل الدخول</h2>
  <p class="login-subtitle">أهلاً بعودتك إلى Rawaj</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="emailOrUserName">البريد الإلكتروني أو اسم المستخدم</label>
      <input
        id="emailOrUserName"
        type="text"
        class="form-control"
        placeholder="name@company.com أو اسم المستخدم"
        formControlName="emailOrUserName" />
      @if (errorMessage('emailOrUserName'); as emailOrUserNameError) {
        <small class="text-danger d-block mt-2 validation-msg">{{ emailOrUserNameError }}</small>
      }
    </div>

    <div class="mb-3">
      <div class="d-flex justify-content-between">
        <label class="form-label" for="password">كلمة المرور</label>
        <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>
      <input
        id="password"
        type="password"
        class="form-control"
        placeholder="••••••••"
        formControlName="password" />
      @if (errorMessage('password'); as passwordError) {
        <small class="text-danger d-block mt-2 validation-msg">{{ passwordError }}</small>
      }
    </div>

    <div class="checkbox-wrapper-46 mb-4">
      <input id="rememberMe" class="inp-cbx" type="checkbox" formControlName="rememberMe" />
      <label for="rememberMe" class="cbx">
        <span>
          <svg viewBox="0 0 12 10" height="10px" width="12px">
            <polyline points="1.5 6 4.5 9 10.5 1"></polyline>
          </svg>
        </span>
        <span>تذكرني</span>
      </label>
    </div>

    <button class="btn login-btn w-100" type="submit">تسجيل الدخول</button>
  </form>

  <div class="text-center mt-4 login-switch-text">
     ليس لديك حساب ؟
    <a href="#" class="signup-link">إنشاء حساب</a>
  </div>

  <div class="divider">أو</div>

  <button class="social-btn">
    <img src="/google.svg" alt="Google" class="social-icon" />
    المتابعة باستخدام Google
  </button>

</div>
