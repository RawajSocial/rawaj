<div class="stepper">
  @for (i of indices(); track i) {
    <div class="stepper-step" [class.completed]="isCompleted(i)" [class.active]="isActive(i)">
      <div class="step-dot">
        @if (isCompleted(i)) {
          <i class="fa-solid fa-check"></i>
        } @else {
          <span>{{ i }}</span>
        }
      </div>
      <span class="step-label">{{ steps()[i - 1] }}</span>
    </div>
    @if (i < totalSteps()) {
      <div class="stepper-line" [class.done]="isLineCompleted(i + 1)"></div>
    }
  }
</div>
