<div class="step-animate">
  <h2 class="step-title">حجم وكالتك ونطاقها</h2>
  <p class="step-subtitle">ساعدنا على فهم حجم عملياتك.</p>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-users" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      كم عدد موظفي الوكالة؟
    </label>
    <div class="radio-group">
      @for (size of sizes; track size; let i = $index) {
        <button
          type="button"
          class="radio-chip"
          [class.selected]="selectedSize() === sizeValues[i]"
          (click)="selectedSize.set(sizeValues[i]); showError.set(false)">
          {{ size }}
        </button>
      }
    </div>
  </div>

  <div class="setup-field">
    <label class="setup-label">
      <i class="fa-solid fa-handshake" style="color:var(--color-secondary); margin-left:0.4rem;"></i>
      عدد العملاء النشطين
    </label>
    <div class="radio-group">
      @for (range of clientRanges; track range; let i = $index) {
        <button
          type="button"
          class="radio-chip"
          [class.selected]="selectedClients() === clientValues[i]"
          (click)="selectedClients.set(clientValues[i]); showError.set(false)">
          {{ range }}
        </button>
      }
    </div>
  </div>

  @if (showError()) {
    <p class="field-error" style="margin-bottom:1rem;">
      <i class="fa-solid fa-circle-exclamation"></i>
      يرجى اختيار الخيارَين للمتابعة.
    </p>
  }

  <div class="step-actions">
    <div class="start">
      <button type="button" class="btn-back" (click)="back.emit()">
        <i class="fa-solid fa-arrow-right"></i>
        السابق
      </button>
    </div>
    <button type="button" class="btn-next" (click)="onNext()">
      التالي
      <i class="fa-solid fa-arrow-left"></i>
    </button>
  </div>
</div>
