<aside class="onboarding-sidebar">
  <div class="brand-block">
    <img src="assets/icons/logo.png" width="60" alt="">
    <div>
      <h2>رواج</h2>
      <p>منصة التسويق الذكي</p>
    </div>
  </div>

  <ol class="steps-list">
    @for (step of steps; track step.index) {
      <li class="step-item"
          [class.active]="isActive(step.index)"
          [class.completed]="isCompleted(step.index)">
        <div class="step-index">
          @if (isCompleted(step.index)) {
            <i class="fa-solid fa-check" style="font-size:12px"></i>
          } @else {
            {{ step.index }}
          }
        </div>
        <div class="step-content">
          <h3>{{ step.title }}</h3>
          <p>{{ step.subtitle }}</p>
        </div>
      </li>
    }
  </ol>

  <p class="sidebar-help">بحاجة للمساعدة؟ تواصل مع فريقنا أو اقرأ الدليل الإرشادي.</p>
</aside>
