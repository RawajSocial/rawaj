<section class="step-content-wrap" appGsapReveal="fade-down-far" [gsapDuration]="900">
  <app-onboarding-step-header
    [currentStep]="currentStep()"
    [totalSteps]="totalSteps()"
    title="أصول الحملة" />

  <app-step-badge icon="fa-solid fa-photo-film" text="الخطوة الخامسة"
    />
  <app-step-heading
    title="ارفع ما يساعدنا على إنشاء محتوى أفضل"
    lead="كلما شاركتنا أكثر، كلما كان المحتوى أكثر دقةً وتوافقاً مع هويتك." />

  <div class="form-grid">

    <!-- ===== PHOTO UPLOAD ===== -->
    <div class="form-row full">
      <label>
        صور المنتج أو العلامة التجارية
        <span>(اختياري — حتى {{ maxImages }} صور)</span>
      </label>

      <!-- Drop zone -->
      <label
        class="drop-zone"
        [class.dragging]="isDragging"
        [class.has-images]="previews().length > 0"
        for="photoUpload"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event)">

        @if (previews().length === 0) {
          <div class="drop-zone-empty">
            <i class="fa-solid fa-cloud-arrow-up drop-icon"></i>
            <span class="drop-title">اسحب الصور هنا أو اضغط للتصفح</span>
            <span class="drop-sub">PNG، JPG — حتى {{ maxImages }} صور</span>
          </div>
        } @else {
          <div class="preview-grid">
            @for (img of previews(); track img.name; let i = $index) {
              <div class="preview-item" (click)="$event.preventDefault(); $event.stopPropagation()">
                <img [src]="img.url" [alt]="img.name" class="preview-img" />
                <button type="button" class="preview-remove" (click)="removeImage(i)" title="حذف">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            }
            @if (previews().length < maxImages) {
              <div class="preview-add" title="إضافة المزيد">
                <i class="fa-solid fa-plus"></i>
              </div>
            }
          </div>
        }
      </label>

      <input
        id="photoUpload"
        type="file"
        class="hidden-input"
        multiple
        accept="image/png,image/jpeg,image/webp,image/gif"
        (change)="handleFiles($any($event.target).files)" />

      <div class="upload-counter">
        <i class="fa-solid fa-images"></i>
        {{ previews().length }} / {{ maxImages }} صور
      </div>
    </div>

    <!-- ===== HASHTAGS ===== -->
    <div class="form-row full">
      <label>الهاشتاقات التي تستخدمها <span>(اختياري)</span></label>
      <div class="input-with-icon">
        <span class="input-icon"><i class="fa-solid fa-hashtag"></i></span>
        <input type="text" class="form-control"
          placeholder="مثال: abaya_fashion, modest_style, lamsa"
          [value]="data()?.hashtags || ''"
          (input)="emit({ hashtags: $any($event.target).value })" />
      </div>
      <span class="field-hint">
        <i class="fa-solid fa-circle-info"></i>
        افصل بين الهاشتاقات بفاصلة — بدون رمز # (نضيفه تلقائياً)
      </span>
    </div>

    <!-- ===== ADDITIONAL NOTES ===== -->
    <div class="form-row full">
      <label>أي شيء آخر تريد إخبارنا به؟ <span>(اختياري)</span></label>
      <textarea class="form-control" rows="4"
        placeholder="مثال: لدينا حملة موسمية قادمة، أو يوجد منتج جديد سيُطلق قريباً، أو أي تفاصيل تراها مهمة..."
        maxlength="500"
        [value]="data()?.additionalNotes || ''"
        (input)="emit({ additionalNotes: $any($event.target).value })"></textarea>
      <span class="char-count">{{ (data()?.additionalNotes || '').length }} / 500</span>
    </div>

  </div>

  <app-onboarding-step-actions (back)="onBack()" (next)="onNext()" />
</section>
