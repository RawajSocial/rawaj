<section class="success-wrap" appGsapReveal="fade-up-far" [gsapDuration]="1200">
  <div class="success">
    <div class="success-ico">✓</div>
    <h2>تم! حسابك جاهز 🎉</h2>
    <p>يعمل الذكاء الاصطناعي الآن على تحليل السوق وبناء استراتيجيتك. سنُرسل لك تقريرك خلال 24 ساعة.</p>
    <div class="success-pills">
      <div class="s-pill">تحليل المنافسين</div>
      <div class="s-pill">بناء خريطة الجمهور</div>
      <div class="s-pill">تقويم المحتوى</div>
      <div class="s-pill">صياغة الاستراتيجية</div>
    </div>
    <button type="button" class="btn-dash" (click)="goToDashboard()">اذهب إلى لوحة التحكم</button>
  </div>
</section>
