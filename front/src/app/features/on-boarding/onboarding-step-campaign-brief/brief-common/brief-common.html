<div class="brief-block common-block" appGsapReveal="fade-up-far" [gsapDuration]="1000">
  <div class="brief-block-title">
    <i class="fa-solid fa-circle-info"></i>
    <span>معلومات الحملة الأساسية</span>
  </div>
  <div class="form-grid">
    <div class="form-row full">
      <label>اسم الحملة <span>(اختياري)</span></label>
      <input type="text" class="form-control" placeholder="مثال: كولكشن رمضان 2027"
        [value]="data()?.campaignName || ''"
        (input)="emit({ campaignName: $any($event.target).value })" />
    </div>
    <div class="form-row full">
      <label>في جملة واحدة، ماذا تريد تحقيقه؟ <span>(اختياري)</span></label>
      <textarea class="form-control" rows="2"
        placeholder="مثال: أريد زيادة مبيعاتي خلال رمضان بنسبة 30%"
        maxlength="200"
        [value]="data()?.campaignGoal || ''"
        (input)="emit({ campaignGoal: $any($event.target).value })"></textarea>
      <span class="char-count">{{ (data()?.campaignGoal || '').length }} / 200</span>
    </div>
    <div class="form-row">
      <label>تاريخ بداية الحملة <span class="required-mark">*</span></label>
      <input type="date" class="form-control"
        [value]="data()?.campaignStartDate || ''"
        (input)="emit({ campaignStartDate: $any($event.target).value })" />
    </div>
    <div class="form-row">
      <label>مدة الحملة <span>(اختياري)</span></label>
      <div class="select-with-icon">
        <span class="select-icon" aria-hidden="true"><i class="fa-solid fa-clock"></i></span>
        <select class="form-control"
          [value]="data()?.campaignDuration || ''"
          (change)="emit({ campaignDuration: $any($event.target).value || undefined })">
          <option value="">اختر مدة الحملة</option>
          @for (d of durations; track d) {
            <option [value]="d" [selected]="data()?.campaignDuration === d">{{ d }}</option>
          }
        </select>
      </div>
    </div>
  </div>
</div>
