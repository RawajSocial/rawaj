<div class="brief-block" appReveal="fade-up-far" [revealDuration]="900">
  <div class="brief-block-title">
    <i class="fa-solid fa-users"></i>
    <span>تفاصيل توليد العملاء</span>
  </div>
  <div class="form-grid">
    <div class="form-row full">
      <label>ماذا تريد العميل أن يفعل؟</label>
      <div class="chips">
        @for (action of leadActions; track action) {
          <button type="button" class="chip" [class.active]="data()?.leadAction === action"
            (click)="emit({ leadAction: action })">{{ action }}</button>
        }
      </div>
    </div>
    <div class="form-row full">
      <label>هل لديك صفحة هبوط أو نموذج جاهز؟</label>
      <div class="chips">
        <button type="button" class="chip" [class.active]="data()?.hasLandingPage === 'yes'"
          (click)="emit({ hasLandingPage: 'yes' })">
          <i class="fa-solid fa-check"></i> نعم
        </button>
        <button type="button" class="chip" [class.active]="data()?.hasLandingPage === 'no'"
          (click)="emit({ hasLandingPage: 'no' })">
          <i class="fa-solid fa-xmark"></i> لا
        </button>
      </div>
    </div>
    @if (data()?.hasLandingPage === 'yes') {
      <div class="form-row full sub-reveal">
        <label>رابط الصفحة أو النموذج</label>
        <input type="url" class="form-control" placeholder="https://example.com/lead-form"
          [value]="data()?.landingPageUrl || ''"
          (input)="emit({ landingPageUrl: $any($event.target).value })" />
      </div>
    }
    <div class="form-row full">
      <label>هل هذا لعلامة جديدة أم قائمة؟</label>
      <div class="chips">
        <button type="button" class="chip" [class.active]="data()?.brandStatusForLeads === 'new'"
          (click)="emit({ brandStatusForLeads: 'new' })">
          <i class="fa-solid fa-star"></i> علامة جديدة
        </button>
        <button type="button" class="chip" [class.active]="data()?.brandStatusForLeads === 'existing'"
          (click)="emit({ brandStatusForLeads: 'existing' })">
          <i class="fa-solid fa-building"></i> علامة قائمة — جمهور جديد
        </button>
      </div>
    </div>
    <div class="form-row full">
      <label>ماذا تريد أن يشعر العميل بعد مشاهدة المحتوى؟ <span>(اختياري)</span></label>
      <textarea class="form-control" rows="3"
        placeholder="مثال: أريده أن يثق بعلامتي ويحجز موعدًا..."
        [value]="data()?.contentFeeling || ''"
        (input)="emit({ contentFeeling: $any($event.target).value })"></textarea>
    </div>
  </div>
</div>
