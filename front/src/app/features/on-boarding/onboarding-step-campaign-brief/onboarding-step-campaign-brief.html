<section class="step-content-wrap">
  <app-onboarding-step-header
    [currentStep]="currentStep()"
    [totalSteps]="totalSteps()"
    [title]="stepTitle()"
  />

  <app-step-badge
    [icon]="stepIcon()"
    text="الخطوة الثانية"
    appReveal="fade-up-far" [revealDuration]="1200"
  />
  <app-step-heading
    title="أخبرنا عن حملتك بالتفصيل"
    lead="كلما شاركتنا تفاصيل أكثر، كلما كانت الاستراتيجية أدق وأكثر تأثيرًا."
    appReveal="fade-up-far" [revealDuration]="1200"
  />

  @switch (selectedType()) {
    @case ('new-business') {
      <app-brief-new-business [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('new-product') {
      <app-brief-new-product [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('drive-sales') {
      <app-brief-drive-sales [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('seasonal') {
      <app-brief-seasonal [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('leads') {
      <app-brief-leads [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('awareness') {
      <app-brief-awareness [data]="data()" (dataChange)="emit($event)" />
    }
    @case ('other') {
      <app-brief-other [data]="data()" (dataChange)="emit($event)" />
    }
  }

  <app-brief-common [data]="data()" (dataChange)="emit($event)" />

  <app-onboarding-step-actions
    [nextDisabled]="!canProceed()"
    (back)="onBack()"
    (next)="onNext()" />
</section>
