<div class="crm-page d-flex flex-column gap-4 p-4">
  <app-page-header
    title="لوحة التحكم"
    [breadcrumbs]="[{ label: 'نظرة عامة', link: '/dashboard' }, { label: 'لوحة التحكم' }]"
    subtitle="نظرة شاملة على أداء حساباتك على مواقع التواصل الاجتماعي." />

  <!-- Social platform filter -->
  <div class="platform-filter d-flex align-items-center flex-wrap gap-2">
    @for (t of filterTabs; track t.key) {
      <button type="button" class="platform-chip d-inline-flex align-items-center gap-2 py-2 px-3"
              [class.active]="platformFilter() === t.key"
              [class.platform-chip--tiktok]="t.key === 'tiktok'"
              [class.platform-chip--snapchat]="t.key === 'snapchat'"
              [style.--chip-color]="t.color"
              (click)="setFilter(t.key)">
        <i class="{{ t.icon }}"></i>
        <span>{{ t.label }}</span>
      </button>
    }
  </div>

  <!-- KPI Row -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3">
    @for (kpi of kpis(); track kpi.title) {
      <div class="col">
        <app-kpi-card
          [title]="kpi.title"
          [value]="kpi.value"
          [icon]="kpi.icon"
          [iconBg]="kpi.iconBg"
          [iconColor]="kpi.iconColor"
          [change]="kpi.change"
          [accentColor]="kpi.accentColor" />
      </div>
    }
  </div>

  <!-- Charts Row -->
  <div class="row g-3">
    <div class="col-lg-8 chart-col d-flex flex-column">
      <app-balance-chart class="flex-grow-1 d-flex flex-column" />
    </div>
    <div class="col-lg-4 chart-col d-flex flex-column">
      <app-connect-accounts-card class="flex-grow-1 d-flex flex-column" />
    </div>
  </div>

  <!-- Platform breakdown + top posts -->
  <div class="row g-3">
    <div class="col-lg-6 d-flex flex-column">
      <app-platform-performance-card class="flex-grow-1 d-flex flex-column" [platforms]="platforms" />
    </div>
    <div class="col-lg-6 d-flex flex-column">
      <app-top-posts-card class="flex-grow-1 d-flex flex-column" [posts]="topPostsView()" />
    </div>
  </div>

  <!-- Meta analytics (placeholder — awaiting Meta Business account connection) -->
  <app-meta-analytics-card [widgets]="metaWidgets" />
</div>
