<div class="row g-3">
  @for (widget of widgets(); track widget.label) {
    <div class="col-lg-6">
      <div class="insight-card meta-card position-relative overflow-hidden h-100">
        <div class="insight-head">
          <h3 class="insight-title"><i class="{{ widget.icon }}"></i> {{ widget.label }}</h3>
          <span class="meta-badge">قريبًا</span>
        </div>
        <div class="meta-metrics">
          @for (metric of widget.metrics; track metric.label) {
            <div class="meta-metric d-flex flex-column">
              <span class="meta-metric-value">{{ metric.value }}</span>
              <span class="meta-metric-label">{{ metric.label }}</span>
            </div>
          }
        </div>
        <div class="meta-overlay position-absolute d-flex flex-column align-items-center justify-content-center text-center p-4">
          <i class="fa-solid fa-lock"></i>
          <p>اربط حساب Meta Business لعرض بياناتك الحقيقية هنا.</p>
          <button type="button" class="meta-connect-btn">ربط الحساب</button>
        </div>
      </div>
    </div>
  }
</div>
