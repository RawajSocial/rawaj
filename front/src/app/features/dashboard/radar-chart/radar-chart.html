<div class="chart-card">
  <div class="chart-header">
    <h4 class="chart-title">معدل الإنجاز</h4>
  </div>

  <div class="radar-wrapper">
    <svg viewBox="0 0 300 300" class="radar-svg">
      <!-- Background ring polygons -->
      @for (poly of ringPolygons(); track $index) {
        <polygon
          [attr.points]="poly"
          fill="none"
          stroke="rgba(0,0,0,0.08)"
          stroke-width="1"
        />
      }

      <!-- Axis lines -->
      @for (axis of axisLines(); track $index) {
        <line
          [attr.x1]="cx"
          [attr.y1]="cy"
          [attr.x2]="axis.x2"
          [attr.y2]="axis.y2"
          stroke="rgba(0,0,0,0.1)"
          stroke-width="1"
        />
      }

      <!-- Data series fills -->
      @for (s of seriesPaths(); track s.label) {
        <polygon
          [attr.points]="s.path"
          [attr.fill]="s.fill"
          [attr.stroke]="s.color"
          stroke-width="1.5"
        />
      }

      <!-- Axis labels -->
      @for (lbl of axisLabels(); track lbl.label) {
        <text
          [attr.x]="lbl.x"
          [attr.y]="lbl.y"
          text-anchor="middle"
          dominant-baseline="middle"
          font-size="11"
          fill="#888"
          font-family="Cairo, sans-serif"
        >{{ lbl.label }}</text>
      }
    </svg>

    <!-- Legend -->
    <div class="radar-legend">
      @for (s of series; track s.label) {
        <span class="radar-legend-item">
          <span class="radar-legend-dot" [style.background]="s.color"></span>
          {{ s.label }}
        </span>
      }
    </div>
  </div>
</div>
