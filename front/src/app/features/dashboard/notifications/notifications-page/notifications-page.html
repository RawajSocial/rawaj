<div class="page-shell">
  <div class="notif-top">
    <app-page-header
      title="الإشعارات"
      [breadcrumbs]="[{ label: 'نظرة عامة', link: '/dashboard' }, { label: 'الإشعارات' }]"
      subtitle="ابقَ على اطلاع بآخر التنبيهات والرسائل." />
    <button type="button" class="rw-btn rw-btn--outline" (click)="markAllRead()">
      <i class="fa-solid fa-check-double"></i>
      تعليم الكل كمقروء
    </button>
  </div>

  <div class="rw-card">
    <div class="notif-card-head">
      <div class="notif-card-title">
        كل الإشعارات
        @if (unreadCount() > 0) {
          <span class="notif-unread-badge">{{ unreadCount() }} غير مقروء</span>
        }
      </div>
      <div class="rw-tabs">
        <button type="button" class="rw-tab" [class.active]="tab() === 'all'" (click)="setTab('all')">الكل</button>
        <button type="button" class="rw-tab" [class.active]="tab() === 'unread'" (click)="setTab('unread')">غير مقروء</button>
        <button type="button" class="rw-tab" [class.active]="tab() === 'read'" (click)="setTab('read')">مقروء</button>
      </div>
    </div>

    @if (loading()) {
      <p class="notif-empty"><i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحميل...</p>
    } @else if (filtered().length === 0) {
      <p class="notif-empty">لا توجد إشعارات في هذا التبويب.</p>
    } @else {
      <div class="notif-list">
        @for (n of filtered(); track n.id) {
          <button type="button" class="notif-item" [class.unread]="!n.isRead" (click)="openNotification(n.id, notificationLink(n))">
            <span class="notif-icon" [style.background]="categoryCfg[n.category].bg" [style.color]="categoryCfg[n.category].color">
              <i class="fa-solid {{ categoryCfg[n.category].icon }}"></i>
            </span>
            <div class="notif-body">
              <div class="notif-title-row">
                <span class="notif-title">{{ n.title }}</span>
                @if (!n.isRead) { <span class="notif-dot"></span> }
              </div>
              <p class="notif-text">{{ n.message }}</p>
              <span class="notif-time">{{ formatTime(n.createdAt) }}</span>
            </div>
          </button>
        }
      </div>
    }
  </div>
</div>
