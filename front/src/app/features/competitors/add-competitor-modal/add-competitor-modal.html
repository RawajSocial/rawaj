<app-modal-shell [open]="open()" [maxWidth]="440" title="إضافة منافس" (closed)="requestClose()">

  <div [formGroup]="form">
    @if (serverError(); as error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <div class="form-field">
      <label for="competitor-name">اسم المنافس</label>
      <input id="competitor-name" type="text" class="form-control" formControlName="name" placeholder="مثال: علامة منافسة">
      @if (submitted() && form.controls.name.invalid) {
        <span class="field-error">الرجاء إدخال اسم المنافس</span>
      }
    </div>

    <div class="form-field">
      <label for="competitor-url">الموقع الإلكتروني (اختياري)</label>
      <input id="competitor-url" type="url" class="form-control" formControlName="url" placeholder="https://example.com">
    </div>
  </div>

  <div class="rw-modal-footer" modal-footer>
    <button type="button" class="btn-outline" (click)="requestClose()">إلغاء</button>
    <button type="button" class="btn-brand" [disabled]="submitting()" (click)="submit()">
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm me-1" role="status"></span>
      }
      إضافة المنافس
    </button>
  </div>

</app-modal-shell>
