<div class="page-shell">
  <div class="page-top">
    <app-page-header
      title="تحليل المنافسين"
      [breadcrumbs]="[{ label: 'لوحة التحكم', link: '/dashboard' }, { label: 'تحليل المنافسين' }]"
      subtitle="أضف منافسيك ودع الذكاء الاصطناعي يحلل مواقعهم واستراتيجياتهم." />
    <button type="button" class="btn-new-camp" (click)="openAddModal()">
      <i class="fa-solid fa-plus"></i>
      إضافة منافس
    </button>
  </div>

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
  } @else if (loadError(); as error) {
    <div class="alert alert-danger">{{ error }}</div>
  } @else if (competitors().length === 0) {
    <div class="empty-state">
      <div class="empty-icon"><i class="fa-solid fa-chess-knight"></i></div>
      <h3>لا يوجد منافسون بعد</h3>
      <p>أضف منافسيك لتحصل على تحليل مدعوم بالذكاء الاصطناعي لاستراتيجياتهم ومحتواهم.</p>
      <button type="button" class="btn-new-camp" (click)="openAddModal()">
        <i class="fa-solid fa-plus"></i>
        إضافة منافس
      </button>
    </div>
  } @else {
    <div class="competitors-grid">
      @for (competitor of competitors(); track competitor.competitorId) {
        <button type="button" class="competitor-card" (click)="openDetail(competitor)">
          <div class="competitor-card-top">
            <span class="competitor-icon"><i class="fa-solid fa-chess-knight"></i></span>
            <span class="rw-pill" [class.rw-pill--success]="competitor.ragged" [class.rw-pill--warning]="!competitor.ragged">
              {{ competitor.ragged ? 'تم التحليل' : 'بانتظار التحليل' }}
            </span>
          </div>
          <h3 class="competitor-name">{{ competitor.name }}</h3>
          @if (competitor.url) {
            <p class="competitor-url">{{ competitor.url }}</p>
          }
          <div class="competitor-card-footer">
            <i class="fa-solid fa-clock"></i>
            {{ formatDate(competitor.lastScrapedAt) }}
          </div>
        </button>
      }
    </div>
  }
</div>

<app-add-competitor-modal
  [open]="addModalOpen()"
  [submitting]="adding()"
  [serverError]="addError()"
  (closed)="addModalOpen.set(false)"
  (save)="onAddSaved($event)" />

<app-competitor-detail-modal
  [open]="selectedCompetitor() !== null"
  [competitor]="selectedCompetitor()"
  (closed)="closeDetail()"
  (analyzed)="onAnalyzed()" />
