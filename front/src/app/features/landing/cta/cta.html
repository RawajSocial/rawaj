<section class="cta-section position-relative"  >
  <!-- Grid overlay and backdrop cosmic stars -->
  <div class="grid-overlay"></div>
  <div class="glow-container">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>

  <div class="container position-relative z-2 text-center" appGsapReveal="fade-up-far" [gsapDuration]="2000">
    <!-- CTA Content -->
    <h2 class="cta-title">جاهز لبناء مشروعك ومضاعفة نموك؟</h2>
    <p class="cta-subtitle">انضم إلى رواد الأعمال والوكالات في الشرق الأوسط الذين يستخدمون رواج لتسريع تسويقهم وتحقيق نتائج حقيقية بالذكاء الاصطناعي.</p>

    <div class="cta-buttons d-flex justify-content-center gap-3 flex-wrap">
      <a routerLink="/sign-up" class="btn btn-primary-glow">ابدأ مجاناً الآن</a>
      <a href="#gallery" class="btn btn-outline-glass">تصفح المعرض</a>
    </div>
  </div>
</section>
