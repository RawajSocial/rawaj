<section class="posts-section" [style.--active-index]="activeIndex" [style.--middle-index]="(posts.length - 1) / 2">
  <div class="container position-relative z-1">

    <!-- Title Section -->
    <div class="text-center section-header" appReveal="fade-up" [revealDuration]="1500">
      <h2 class="title">منشورات صنعتها رواج</h2>
      <p class="subtitle m-0">تصاميم تفاعلية مبتكرة لعلامات تجارية عربية — جاهزة للنشر والانتشار</p>
    </div>

    <!-- Carousel Container -->
    <div class="carousel-container" appReveal="fade-up" [revealDuration]="2000">
      <div class="carousel-track">
        @for (post of posts; track post.id; let i = $index) {
          <div class="carousel-card"
               [class.active]="i === activeIndex"
               [class.faded]="i !== activeIndex">
            <div class="card-inner">
                <div class="phone-frame">
                  <span class="phone-notch"></span>
                  <span class="phone-button phone-button-top"></span>
                  <span class="phone-button phone-button-bottom"></span>
                  <img [src]="post.image" [alt]="post.title" class="post-img">
                </div>
                <div class="card-glow"></div>
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="carousel-controls d-flex justify-content-center gap-3" >
      <!-- Right Arrow (Prev) -->
      <button class="control-btn prev-btn" (click)="prev()" aria-label="Previous">
        <i class="fas fa-chevron-right"></i>
      </button>

      <!-- Left Arrow (Next) -->
      <button class="control-btn next-btn" (click)="next()" aria-label="Next">
        <i class="fas fa-chevron-left"></i>
      </button>
    </div>

  </div>
</section>
