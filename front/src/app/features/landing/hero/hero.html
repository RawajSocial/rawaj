<!-- HERO -->
<section class="hero-section">

  <div class="hero-grid"></div>
  <div class="grid-lines" aria-hidden="true">
    <!-- Sequence 1 (Starts Left) -->
    <span class="circuit-line h-line h-1"><span class="pulse"></span></span>
    <span class="circuit-line v-line v-1"><span class="pulse"></span></span>
    <span class="circuit-line h-line h-2"><span class="pulse"></span></span>
    <span class="circuit-line v-line v-2"><span class="pulse"></span></span>
    <span class="circuit-line h-line h-3"><span class="pulse"></span></span>

    <!-- Sequence 2 (Starts Right) -->
    <span class="circuit-line h-line h-4"><span class="pulse"></span></span>
    <span class="circuit-line v-line v-3"><span class="pulse"></span></span>
    <span class="circuit-line h-line h-5"><span class="pulse"></span></span>
    <span class="circuit-line v-line v-4"><span class="pulse"></span></span>
    <span class="circuit-line h-line h-6"><span class="pulse"></span></span>
  </div>

  <div class="container position-relative">

    <!-- Announcement -->
    <div class="announcement-badge mx-auto text-center" appReveal="fade-up" [revealDuration]="1500">
      منصة تسويق ذكية مدعومة بالذكاء الاصطناعي
    </div>

    <!-- Main Title -->
    <h1 class="hero-title text-center" appReveal="fade-up" [revealDuration]="1500">
  تسويق أذكى يساعدك على بناء حضور أقوى
      <span>نتائج أسرع ونمو أقوى</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-description text-center mx-auto" appReveal="fade-up" [revealDuration]="1500">
      منصة متطورة تساعدك على بناء وإدارة حملاتك التسويقية
      بتصميم عصري وتجربة استخدام احترافية.
    </p>

    <!-- Buttons -->
    <div class="hero-buttons d-flex justify-content-center gap-3 flex-wrap"appReveal="fade-up" [revealDuration]="1500">
