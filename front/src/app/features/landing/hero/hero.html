<!-- HERO -->
<section class="hero-section">

  <!-- Sastik-style hero shapes: top light, rising particles, orbit circle -->
  <div class="as-hero-shape" aria-hidden="true">
    <div class="shape shape--1"><img src="assets/img/shape/hero-light-effect01.png" alt=""></div>
    <div class="shape shape--2"><img src="assets/img/shape/hero-light-effect02.png" alt=""></div>
    <div class="shape shape--3 shape--3a">
      <div class="img marquee-2">
        <img src="assets/img/shape/particals-dot.png" alt="">
        <img src="assets/img/shape/particals-dot.png" alt="">
      </div>
    </div>
    <div class="shape shape--3 shape--3b">
      <div class="img marquee-2">
        <img src="assets/img/shape/particals-dot.png" alt="">
        <img src="assets/img/shape/particals-dot.png" alt="">
      </div>
    </div>
    <div class="shape shape--3 shape--3c">
      <div class="img marquee-2">
        <img src="assets/img/shape/particals-dot.png" alt="">
        <img src="assets/img/shape/particals-dot.png" alt="">
      </div>
    </div>
    <div class="shape shape--4">
      <div class="orbit orbit--outer">
        <span class="orbit-dot"></span>
      </div>
      <div class="orbit orbit--inner">
        <span class="orbit-dot"></span>
      </div>
    </div>
    <div class="shape shape--5"></div>
  </div>

  <div class="container position-relative">

    <!-- Announcement -->
    <div class="announcement-badge mx-auto text-center" appReveal="fade-up" [revealDuration]="1500">
      <span class="badge-flags" aria-hidden="true">
        <span class="badge-flag badge-flag--eg"><img src="assets/icons/flags/egypt.png" alt=""></span>
        <span class="badge-flag badge-flag--sa"><img src="assets/icons/flags/Saudi Arabia.png" alt=""></span>
        <span class="badge-flag badge-flag--ae"><img src="assets/icons/flags/UAE.png" alt=""></span>
      </span>
      منصة تسويق ذكية مدعومة بالذكاء الاصطناعي موجهة لدول الشرق الأوسط
      <span class="badge-dot" aria-hidden="true"></span>
    </div>

    <!-- Main Title -->
    <h1 class="hero-title text-center" appReveal="fade-up" [revealDuration]="1500">
  تسويق أذكى يساعدك على بناء حضور أقوى
      <span>نتائج أسرع ونمو أقوى</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-description text-center mx-auto" appReveal="fade-up" [revealDuration]="1500">
      منصة متطورة تساعدك على بناء وإدارة حملاتك التسويقية
      بتصميم عصري وتجربة استخدام احترافية.
    </p>

    <!-- Buttons -->
    <div class="hero-buttons d-flex justify-content-center gap-3 flex-wrap"appReveal="fade-up" [revealDuration]="1500">
