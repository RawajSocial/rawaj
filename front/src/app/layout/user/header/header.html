<header class="dash-header">
  <div class="header-start">
    <button class="header-btn sidebar-toggle-btn" (click)="toggleSidebar.emit()" appTooltip="تبديل الشريط الجانبي" aria-label="تبديل الشريط الجانبي">
      <i class="fa-solid fa-bars"></i>
    </button>
    <button class="header-btn mobile-menu-btn" (click)="toggleMobileMenu.emit()" appTooltip="القائمة" aria-label="القائمة">
      <i class="fa-solid" [class.fa-bars]="!mobileMenuOpen()" [class.fa-xmark]="mobileMenuOpen()"></i>
    </button>
    <div class="header-search">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input
        type="text"
        placeholder="بحث..."
        [value]="searchQuery()"
        (input)="searchQuery.set($any($event.target).value)"
      />
    </div>
  </div>

  <div class="header-end">
    <a class="credit-chip" routerLink="/dashboard/billing" title="الرصيد والباقات">
      <img src="/coin.png" alt="" class="credit-chip__coin" />
      <span class="credit-chip__amount">{{ creditBalanceLabel() }}</span>
    </a>

    <button class="header-btn" (click)="toggleFullscreen()" appTooltip="ملء الشاشة" aria-label="ملء الشاشة">
      <i class="fa-solid" [class.fa-expand]="!fullscreen()" [class.fa-compress]="fullscreen()"></i>
    </button>

    <!-- Notifications -->
    <div class="header-dropdown notif-dropdown" [class.open]="notifOpen()">
      <button class="header-btn badge-btn" (click)="notifOpen.update(v => !v)">
        <i class="fa-regular fa-bell"></i>
        <span class="header-badge">4</span>
      </button>
      <div class="dropdown-panel notif-panel">
        <div class="panel-head">
          <span class="panel-title">الإشعارات</span>
          <span class="panel-count">4 جديد</span>
        </div>
        <div class="notif-item">
          <div class="notif-icon notif-icon--primary">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <div class="notif-body">
            <p class="notif-text">تم إضافة عميل جديد</p>
            <span class="notif-time">منذ 5 دقائق</span>
          </div>
        </div>
        <div class="notif-item">
          <div class="notif-icon notif-icon--success">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <div class="notif-body">
            <p class="notif-text">تم إغلاق صفقة بنجاح</p>
            <span class="notif-time">منذ 30 دقيقة</span>
          </div>
        </div>
        <div class="notif-item">
          <div class="notif-icon notif-icon--warning">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <div class="notif-body">
            <p class="notif-text">تنبيه: موعد اجتماع قادم</p>
            <span class="notif-time">منذ ساعة</span>
          </div>
        </div>
        <div class="panel-foot">
          <a routerLink="/dashboard/notifications" (click)="notifOpen.set(false)">عرض جميع الإشعارات</a>
        </div>
      </div>
    </div>

    <!-- Profile -->
    <div class="header-dropdown profile-dropdown" [class.open]="profileOpen()">
      <button class="profile-btn" (click)="profileOpen.update(v => !v)">
        <app-avatar [src]="currentUser()?.avatarUrl" [alt]="currentUser()?.fullName ?? ''" size="sm" />
        <span class="profile-name">{{ currentUser()?.fullName }}</span>
        <i class="fa-solid fa-chevron-down profile-caret"></i>
      </button>
      <div class="dropdown-panel profile-panel">
        <div class="profile-header-info">
          <app-avatar [src]="currentUser()?.avatarUrl" [alt]="currentUser()?.fullName ?? ''" size="md" />
          <div>
            <p class="profile-name-lg">{{ currentUser()?.username }}</p>
            <span class="profile-role">{{ tenantRoleLabel() }}</span>
          </div>
        </div>
        <div class="panel-divider"></div>
        <a class="profile-menu-item" routerLink="/dashboard/settings" (click)="profileOpen.set(false)">
          <i class="fa-regular fa-user"></i>
          الملف الشخصي
        </a>
        <a class="profile-menu-item" routerLink="/dashboard/settings" (click)="profileOpen.set(false)">
          <i class="fa-solid fa-gear"></i>
          الإعدادات
        </a>
        <a class="profile-menu-item" routerLink="/dashboard/billing" (click)="profileOpen.set(false)">
          <i class="fa-solid fa-credit-card"></i>
          الفوترة
        </a>
        <div class="panel-divider"></div>
        <a class="profile-menu-item profile-menu-item--danger" (click)="profileOpen.set(false); logout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          تسجيل الخروج
        </a>
      </div>
    </div>
  </div>
</header>
